name: Build ebusd configuration

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: tem

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show installed versions
        run: |
          npm list @ebusd/ebus-typespec @typespec/compiler

      - name: Build German configuration
        run: npm run compile-de

      - name: Find generated files
        run: |
          echo "================================"
          echo "=== CSV-DATEIEN ================"
          echo "================================"
          find . -type f -name "*.csv" -print

          echo ""
          echo "================================"
          echo "=== TEM-DATEIEN ================"
          echo "================================"
          find . -type f | grep -i "tem" || true

          echo ""
          echo "================================"
          echo "=== OUTCSV.DE ==================="
          echo "================================"
          if [ -d "outcsv.de" ]; then
            find outcsv.de -maxdepth 10 -type f -print
          else
            echo "outcsv.de existiert nicht"
          fi

          echo ""
          echo "================================"
          echo "=== VERZEICHNISSE ==============="
          echo "================================"
          find . -maxdepth 5 -type d -print | sort

      - name: Upload generated files
        uses: actions/upload-artifact@v6
        with:
          name: ebusd-config-de
          path: |
            outcsv.de/
            **/*.csv
          if-no-files-found: error
