name: Build ebusd configuration

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tem

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Show installed versions
        run: |
          npm list @ebusd/ebus-typespec @typespec/compiler
          node -e "console.log(require('@typespec/compiler/package.json').version)"
          node -e "console.log(require('@ebusd/ebus-typespec/package.json').version)"

      - name: Build German configuration
        run: npm run compile-de

      - name: Upload generated CSV
        uses: actions/upload-artifact@v4
        with:
          name: ebusd-config-de
          path: outcsv.de/
